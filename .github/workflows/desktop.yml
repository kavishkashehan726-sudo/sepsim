# Tests the simulator, then builds the Windows installers:
#   - Windows 10/11: Tauri, one installer each for 64-bit and 32-bit. The WebView2 runtime
#     is included, so it installs on PCs with no internet.
#   - Windows 7/8: Electron 22, one installer for both 32-bit and 64-bit.
# Each installer is installed silently on a Windows runner and started, as a smoke test.
# Installers are kept as workflow artifacts; pushing a tag like v0.1.0 also makes a release.
name: Desktop installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The golden-trace parity tests need the private tests/golden submodule and are
      # skipped without it; everything else runs.
      - run: npm test
      - run: npm run build

  windows-7-8:
    needs: test
    # Windows Server 2022 is the oldest runner GitHub offers, and the closest to the
    # Windows 7/8 PCs this build is for.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/electron/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop/electron
      - name: Build installer
        working-directory: desktop/electron
        run: npm run dist
      - name: Install silently and start
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/electron/dist/*-Setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs\SEPSim\SEPSim.exe"
          $log = "$env:RUNNER_TEMP\sepsim.log"
          $app = Start-Process $exe.FullName -ArgumentList "--enable-logging", "--log-file=$log" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) {
            if (Test-Path $log) { Get-Content $log -Tail 100 }
            throw "SEPSim exited straight away (code $($app.ExitCode))"
          }
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SEPSim-Windows-7-8
          path: desktop/electron/dist/*-Setup.exe
          if-no-files-found: error

  windows-10-11:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: 64-bit
          - target: i686-pc-windows-msvc
            arch: 32-bit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm ci
        working-directory: desktop/tauri
      - name: Build installer
        working-directory: desktop/tauri
        run: npm run dist -- --target ${{ matrix.target }}
      - name: Name the installer
        shell: pwsh
        run: |
          $version = (Get-Content desktop/tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem "desktop/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "out/SEPSim-$version-Windows-10-11-${{ matrix.arch }}-Setup.exe"
      - name: Install silently and start
        shell: pwsh
        run: |
          $setup = Get-ChildItem out/*-Setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\SEPSim", "$env:ProgramFiles\SEPSim", "${env:ProgramFiles(x86)}\SEPSim" -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          if (-not $exe) { throw "SEPSim was not installed" }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "SEPSim exited straight away (code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SEPSim-Windows-10-11-${{ matrix.arch }}
          path: out/*-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-7-8, windows-10-11]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*.exe
          draft: true
