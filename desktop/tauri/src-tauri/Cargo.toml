[package]
name = "sepsim"
version = "0.1.0"
description = "SEPSim, a simulator for the SEP processor"
authors = ["SEPSim contributors"]
license = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
